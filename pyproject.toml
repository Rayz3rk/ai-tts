[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "local-audio-studio"
version = "0.1.0"
description = "Local speech presets, F5 fine-tuning and deployment workbench"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "python-multipart>=0.0.18", "pydantic>=2.10,<3", "soundfile>=0.13", "numpy>=1.26,<2.5", "psycopg[binary]>=3.2,<4", "python-dotenv>=1,<2"]

[project.optional-dependencies]
tts = ["f5-tts==1.1.21", "kokoro==0.9.4", "misaki[en,zh]==0.9.4", "torch==2.8.0", "torchaudio==2.8.0", "torchcodec>=0.7,<0.8", "librosa>=0.10.2,<0.12"]
singing = ["torch==2.8.0", "torchaudio==2.8.0", "transformers>=4.44,<6", "librosa>=0.10.2,<0.12", "huggingface-hub>=0.30,<2", "faiss-cpu>=1.9", "onnxruntime>=1.20,<2", "mido>=1.3,<2", "pypinyin>=0.51", "PyYAML>=6"]
test = ["pytest>=8", "httpx>=0.27"]

[project.scripts]
audio-studio = "audio_studio.__main__:main"

[tool.setuptools.packages.find]
include = ["audio_studio*"]

[tool.setuptools.package-data]
audio_studio = ["static/*.html", "static/*.js", "static/*.css", "migrations/*.sql", "vendor/rvc/LICENSE", "vendor/rvc/PROVENANCE.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[[tool.uv.index]]
name = "tuna"
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

